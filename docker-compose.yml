name: goneops

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: goneops-frontend
    ports:
      - "3000:80"
    networks:
      - goneops_net
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goneops-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=goneops
      - PGUSER=goneops
      - PGPASSWORD=goneops
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://goneops:goneops@rabbitmq:5672
      - SANDBOX_BASE_DIR=/tmp/goneops-sandboxes
      - SANDBOX_PORT_BASE=20000
      - NODE_ENV=development
      - PUBLIC_HOST=192.168.1.147
      - PROXMOX_TOKEN_ENC_KEY=change-me-to-a-strong-random-string-at-least-32-chars
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - goneops_sandboxes:/tmp/goneops-sandboxes
    networks:
      - goneops_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  postgres:
    image: postgres:15-alpine
    container_name: goneops-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=goneops
      - POSTGRES_USER=goneops
      - POSTGRES_PASSWORD=goneops
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - goneops_pgdata:/var/lib/postgresql/data
    networks:
      - goneops_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goneops -d goneops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: goneops-redis
    ports:
      - "6379:6379"
    networks:
      - goneops_net

  rabbitmq:
    image: rabbitmq:3.12-alpine
    container_name: goneops-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=goneops
      - RABBITMQ_DEFAULT_PASS=goneops
    networks:
      - goneops_net

networks:
  goneops_net:
    name: goneops_net
    driver: bridge

volumes:
  goneops_pgdata:
  goneops_sandboxes:
