services:
  postgres:
    image: postgres:16-alpine
    container_name: goneops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goneops}
      POSTGRES_USER: ${POSTGRES_USER:-goneops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goneops} -d ${POSTGRES_DB:-goneops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: goneops-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: goneops-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-goneops}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me-locally}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  gitea:
    image: gitea/gitea:1.22-rootless
    container_name: goneops-gitea
    environment:
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:-localhost}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-http://localhost:3001/}
      GITEA__server__HTTP_PORT: 3000
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
    ports:
      - "${GITEA_PORT:-3001}:3000"
      - "${GITEA_SSH_PORT:-2222}:2222"
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v2.8.0
    container_name: goneops-woodpecker-server
    environment:
      WOODPECKER_OPEN: "true"
      WOODPECKER_HOST: ${WOODPECKER_HOST:-http://localhost:8000}
      WOODPECKER_GITEA: "true"
      WOODPECKER_GITEA_URL: ${GITEA_ROOT_URL:-http://gitea:3000/}
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:-change-me-locally}
    ports:
      - "${WOODPECKER_PORT:-8000}:8000"
    volumes:
      - woodpecker-data:/var/lib/woodpecker
    depends_on:
      - gitea

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v2.8.0
    container_name: goneops-woodpecker-agent
    command: agent
    environment:
      WOODPECKER_SERVER: woodpecker-server:9000
      WOODPECKER_AGENT_SECRET: ${WOODPECKER_AGENT_SECRET:-change-me-locally}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - woodpecker-server

volumes:
  postgres-data:
  gitea-data:
  gitea-config:
  woodpecker-data:
